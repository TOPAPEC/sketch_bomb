<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Bomb</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="left">
  <h1>Sketch Bomb</h1>
  <canvas id="c" width="392" height="392"></canvas>
  <div class="toolbar">
    <button class="btn-tool active" id="btn-pen" onclick="setTool('pen')">Pen</button>
    <button class="btn-tool" id="btn-eraser" onclick="setTool('eraser')">Eraser</button>
    <button class="btn-tool" onclick="undo()">Undo</button>
    <button class="btn-tool" onclick="redo()">Redo</button>
    <button class="btn-tool" onclick="clearCanvas()">Clear</button>
  </div>
  <div class="toolbar">
    <button class="btn-gen" id="btn" onclick="generate()">Generate</button>
  </div>

  <div class="controls">
    <div class="control-row">
      <label>Model</label>
      <select id="sel-model">
        <option value="lightning" selected>Lightning (fast)</option>
        <option value="sd15">SD 1.5</option>
        <option value="sdxl">SDXL (slow)</option>
      </select>
    </div>
    <div class="control-row">
      <label>Best of</label>
      <select id="sel-bestof">
        <option value="1">1 (fastest)</option>
        <option value="4" selected>4 (recommended)</option>
        <option value="8">8 (best quality)</option>
      </select>
    </div>
    <div class="control-row">
      <label>Selector</label>
      <select id="sel-selector">
        <option value="siglip">SigLIP2</option>
        <option value="siglip_multi">SigLIP2 Multi</option>
        <option value="kimi">Kimi K2.5</option>
      </select>
    </div>
    <div class="control-row">
      <label>Remove BG</label>
      <label class="toggle">
        <input type="checkbox" id="chk-rembg" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="control-row">
      <label>Seed</label>
      <input type="number" id="inp-seed" placeholder="random" min="0" max="999999">
    </div>
  </div>

  <div class="pred" id="pred"></div>
</div>
<div class="right" id="out">
  <div class="empty">Draw a sketch and hit Generate</div>
</div>
<script src="app.js"></script>
</body>
</html>
